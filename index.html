<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MultiStream [Twitch/Kick]</title>
  <script src="https://embed.twitch.tv/embed/v1.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;800;900&display=swap" rel="stylesheet">
  
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/renderers/CSS3DRenderer.js"></script>

  <style>
    * { box-sizing: border-box; }
    :root { --header-h: 100px; }

    body {
      font-family: system-ui, -apple-system, sans-serif;
      background: #0e0e10; color: #efeff1; margin: 0; padding: 0;
      overflow: hidden; display: flex; flex-direction: column; height: 100vh;
    }
    
    ::-webkit-scrollbar { width: 10px; height: 10px; }
    ::-webkit-scrollbar-track { background: #0e0e10; border-radius: 5px; }
    ::-webkit-scrollbar-thumb { background: #3a3a3d; border-radius: 5px; border: 2px solid #0e0e10; }
    ::-webkit-scrollbar-thumb:hover { background: #666; }

    .header-wrapper {
      display: flex; flex-direction: column; background: rgba(24, 24, 27, 0.95);
      backdrop-filter: blur(10px); border-bottom: 1px solid #2d2d30; z-index: 10000; position: relative;
    }
    .header-main { display: flex; justify-content: space-between; align-items: center; padding: 8px 16px; height: 48px; }
    .logo {
      font-family: 'Montserrat', sans-serif; font-size: 24px; font-weight: 900;
      letter-spacing: -0.5px; color: #efeff1; display: flex; align-items: center; user-select: none; cursor: pointer;
    }
    .logo:hover { opacity: 0.8; }
    .logo .multi-stream { color: #efeff1; display: flex; align-items: center; }
    .logo .multi-stream span { color: #ff4d4d; margin-left: 2px; }
    .logo .badge { 
      font-size: 12px; color: #888; font-weight: 600; margin-left: 8px; 
      letter-spacing: 0; text-transform: uppercase; padding: 2px 6px; 
      background: #1f1f23; border-radius: 4px; border: 1px solid #3a3a3d;
    }
    
    .update-timer {
      font-size: 11px; color: #666; margin-left: 12px; font-weight: 500;
      font-family: system-ui, sans-serif; letter-spacing: 0; text-transform: none; transform: translateY(2px);
    }

    .header-controls { display: flex; align-items: center; gap: 12px; }

    .view-selector { position: relative; }
    .view-btn {
      padding: 6px 12px; background: #1f1f23; border: 1px solid #333; border-radius: 6px;
      color: #888; cursor: pointer; font-size: 12px; transition: all 0.2s;
      text-transform: uppercase; letter-spacing: 1px; display: flex; align-items: center; gap: 6px;
    }
    .view-btn:hover { color: #fff; background: #2a2a2e; border-color: #666; }
    .view-btn svg { width: 10px; height: 10px; fill: currentColor; }
    .view-dropdown {
      position: absolute; top: calc(100% + 8px); right: 0; background: #1f1f23;
      border: 1px solid #3a3a3d; border-radius: 8px; padding: 6px; min-width: 120px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.5); opacity: 0; visibility: hidden;
      transform: translateY(-10px); transition: all 0.2s ease; display: flex; flex-direction: column; gap: 4px; z-index: 10001;
    }
    .view-dropdown.open { opacity: 1; visibility: visible; transform: translateY(0); }
    .view-option { padding: 8px 12px; border-radius: 6px; cursor: pointer; font-size: 14px; color: #ccc; transition: all 0.15s; }
    .view-option:hover { background: #2a2a2e; color: #fff; }
    .view-option.active { background: #9147ff; color: #fff; }

    .header-toggle {
      padding: 6px 12px; background: #1f1f23; border: 1px solid #333; border-radius: 6px;
      color: #888; cursor: pointer; font-size: 12px; transition: all 0.2s; text-transform: uppercase; letter-spacing: 1px;
    }
    .header-toggle:hover { color: #fff; background: #2a2a2e; border-color: #666; }

    .header-body {
      display: flex; flex-wrap: wrap; gap: 10px; padding: 0 16px 12px; align-items: center;
      transition: all 0.3s ease; max-height: 80px; overflow: hidden; opacity: 1;
    }
    .header-wrapper.collapsed .header-body { max-height: 0; padding-top: 0; padding-bottom: 0; opacity: 0; }

    .header-body input {
      flex: 1 1 250px; padding: 10px 14px; border-radius: 6px; border: 1px solid #3a3a3d;
      background: #0e0e10; color: #efeff1; font-size: 14px; transition: all 0.3s ease; outline: none;
    }
    .header-body input:focus { border-color: #666; box-shadow: 0 0 0 2px rgba(255, 255, 255, 0.1); }
    .header-body input.error { border-color: #ff4d4d; box-shadow: 0 0 0 2px rgba(255, 77, 77, 0.2); animation: shake 0.4s ease; }
    .header-body button {
      padding: 8px 16px; border-radius: 6px; border: 1px solid #444; background: #1f1f23;
      color: #ccc; font-size: 14px; font-weight: 500; cursor: pointer; transition: all 0.2s ease;
    }
    .header-body button:hover { background: #2a2a2e; color: #fff; border-color: #666; }
    .header-body button:active { background: #151517; }
    .header-body button.active { background: #9147ff; color: #fff; border-color: #9147ff; }

    #view-3d, #view-2d { flex: 1; position: relative; display: none; }
    #view-3d { background: #050505; }
    #view-2d { background: #0e0e10; overflow-y: auto; }
    #canvas-container, #css3d-container { position: absolute; top: 0; left: 0; width: 100%; height: 100%; display: block; }
    #canvas-container { z-index: 1; }
    #css3d-container { pointer-events: none; z-index: 2; }
    #view-3d-controls { position: absolute; top: 14px; left: 14px; z-index: 30; display: none; align-items: center; gap: 9px; }
    #view-3d-controls button { border: 1px solid #49434f; border-radius: 7px; padding: 9px 13px; background: rgba(20, 19, 24, 0.92); color: #efeff1; font-size: 12px; font-weight: 700; letter-spacing: .5px; cursor: pointer; backdrop-filter: blur(8px); transition: .2s ease; }
    #view-3d-controls button:hover { border-color: #9147ff; background: #292033; }
    #view-3d-controls button.is-active { border-color: #9147ff; background: #30203f; color: #fff; }
    #roomStatus { color: #aaa4b2; font-size: 10px; letter-spacing: 1.2px; font-weight: 800; padding: 9px 12px; border: 1px solid rgba(145,71,255,.25); background: rgba(12,11,15,.76); border-radius: 7px; }
    .tv-screen-wrapper { position: relative; overflow: hidden; background: #000; border: 9px solid #080809; outline: 2px solid #29252d; box-shadow: 0 0 18px rgba(0,0,0,.9), inset 0 0 14px #000; pointer-events: auto; isolation: isolate; cursor: default; backface-visibility: hidden; }
    .tv-player-mount { position: absolute; inset: 0; width: 100%; height: 100%; overflow: hidden; background: #000; pointer-events: none; }
    .tv-player-mount > div, .tv-player-mount iframe { position: absolute !important; inset: 0 !important; width: 100% !important; height: 100% !important; border: 0 !important; display: block; background: #000; }
    .tv-placeholder { position: absolute; inset: 0; display: none; flex-direction: column; align-items: center; justify-content: center; gap: 9px; background: radial-gradient(circle at 50% 42%, #101014 0%, #030304 72%); color: #ddd; font-family: system-ui, sans-serif; text-align: center; pointer-events: none; }
    .tv-placeholder-icon { font-size: 56px; filter: drop-shadow(0 0 12px rgba(110,70,150,.3)); }
    .tv-placeholder-title { color: #dedbe4; font-size: 22px; font-weight: 800; letter-spacing: .3px; }
    .tv-placeholder-subtitle { color: #77727e; font-size: 13px; }
    .tv-screen-controls { width: 142px; min-height: 184px; padding: 10px; display: flex; flex-direction: column; align-items: stretch; justify-content: center; gap: 8px; border: 1px solid #51465b; border-radius: 9px; background: linear-gradient(145deg, rgba(22,20,26,.99), rgba(5,5,7,.99)); box-shadow: 0 8px 22px rgba(0,0,0,.96), inset 0 1px 0 rgba(255,255,255,.06); pointer-events: auto; }
    .tv-screen-action { width: 100%; min-height: 47px; flex: 0 0 47px; display: flex; align-items: center; justify-content: center; border: 1px solid #62576b; border-radius: 6px; background: linear-gradient(180deg, #29242f, #151319); color: #f3eff8; font: 900 10px system-ui, sans-serif; letter-spacing: .35px; cursor: pointer; pointer-events: auto; box-shadow: 0 3px 8px rgba(0,0,0,.7); white-space: nowrap; }
    .tv-screen-action:hover, .tv-screen-action.is-active { background: linear-gradient(180deg, #6943a0, #41265e); border-color: #a77be0; color: #fff; }
    .tv-screen-close { border-color: #694047; background: linear-gradient(180deg, #342025, #1b1114); }
    .tv-screen-close:hover { background: linear-gradient(180deg, #a83f4b, #702630); border-color: #e46d78; }
    .tv-chat-wrapper { width: 350px; height: 470px; display: flex; flex-direction: column; overflow: hidden; background: #0b0b0e; border: 3px solid #685080; border-radius: 10px; box-shadow: 0 14px 40px rgba(0,0,0,.95); pointer-events: auto; }
    .tv-chat-header { height: 40px; flex: 0 0 40px; display: flex; align-items: center; justify-content: space-between; padding: 0 11px 0 15px; background: #19171d; color: #f0eaf7; font: 900 13px system-ui, sans-serif; letter-spacing: 1.5px; }
    .tv-chat-close { width: 32px; height: 32px; border: 1px solid #63566e; border-radius: 6px; background: #302738; color: #fff; font-size: 23px; line-height: 1; cursor: pointer; }
    .tv-chat-close:hover { background: #a83f4b; border-color: #e46d78; }
    .tv-chat-wrapper iframe { width: 100%; height: calc(100% - 40px); flex: 1; border: 0; background: #0e0e10; }
    @media (max-width: 768px) {
      #view-3d-controls { top: 8px; left: 8px; gap: 5px; }
      #view-3d-controls button { padding: 7px 9px; font-size: 10px; }
      #roomStatus { font-size: 8px; padding: 7px 8px; }
    }

    .grid { display: grid; gap: 8px; padding: 8px; width: 100%; height: 100%; overflow: hidden; background: #0e0e10; }
    .grid[data-count="1"] { grid-template-columns: 1fr; grid-template-rows: 1fr; }
    .grid[data-count="2"] { grid-template-columns: 1fr 1fr; grid-template-rows: 1fr; }
    .grid[data-count="3"] { grid-template-columns: 1fr 1fr; grid-template-rows: 1fr 1fr; }
    .grid[data-count="4"] { grid-template-columns: 1fr 1fr; grid-template-rows: 1fr 1fr; }
    .grid[data-count="5"] { grid-template-columns: 1fr 1fr 1fr; grid-template-rows: 1fr 1fr; }
    .grid[data-count="6"] { grid-template-columns: 1fr 1fr 1fr; grid-template-rows: 1fr 1fr; }
    .grid[data-count="7"] { grid-template-columns: 1fr 1fr 1fr 1fr; grid-template-rows: 1fr 1fr; }
    .grid[data-count="8"] { grid-template-columns: 1fr 1fr 1fr 1fr; grid-template-rows: 1fr 1fr; }
    .grid[data-count="9"] { grid-template-columns: 1fr 1fr 1fr; grid-template-rows: 1fr 1fr 1fr; }
    .grid[data-count="many"] { grid-template-columns: repeat(auto-fill, minmax(350px, 1fr)); grid-auto-rows: minmax(250px, 1fr); overflow-y: auto; }

    .stream-card {
      position: relative; background: #000; border-radius: 8px; overflow: hidden;
      border: 1px solid #2d2d30; min-width: 0; min-height: 0;
      animation: popIn 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
    }
    .player-container { position: absolute; inset: 0; background: #000; cursor: pointer; }
    .player-container iframe, .player-container > div {
      width: 100% !important; height: 100% !important; border: none; position: absolute; top: 0; left: 0;
    }
    
    .card-actions {
      position: absolute; top: 8px; right: 8px; z-index: 10; display: flex; gap: 6px;
      opacity: 0; transition: opacity 0.2s ease; pointer-events: none;
    }
    .stream-card:hover .card-actions, .stream-card.is-active .card-actions { opacity: 1; pointer-events: auto; }
    .card-actions button {
      width: 32px; height: 32px; border-radius: 6px; border: 1px solid rgba(255, 255, 255, 0.1);
      background: rgba(14, 14, 16, 0.85); color: #fff; font-size: 16px; cursor: pointer;
      display: flex; align-items: center; justify-content: center; transition: all 0.2s ease; backdrop-filter: blur(6px);
    }
    .card-actions .chat-btn:hover { background: #9147ff; border-color: #9147ff; transform: scale(1.05); }
    .stream-card.is-active .chat-btn { background: #9147ff; border-color: #9147ff; }
    .card-actions .remove-btn:hover { background: #ff4d4d; border-color: #ff4d4d; transform: scale(1.05); }

    .stream-card.is-active {
      position: fixed !important; top: calc(var(--header-h) + 10px) !important; left: 20px !important;
      width: calc(100vw - 380px) !important; height: calc(100vh - var(--header-h) - 20px) !important;
      z-index: 9999 !important; border: 2px solid #9147ff; box-shadow: 0 10px 40px rgba(0,0,0,0.9); border-radius: 8px;
    }
    .grid.theater > .stream-card:not(.is-active) { filter: blur(4px) brightness(0.3); pointer-events: none; }
    .chat-sidebar {
      position: fixed !important; top: calc(var(--header-h) + 10px) !important; right: 20px !important;
      width: 320px !important; height: calc(100vh - var(--header-h) - 20px) !important;
      z-index: 9999 !important; background: #0e0e10; border: 1px solid #2d2d30; border-radius: 8px;
      display: flex; flex-direction: column; overflow: hidden; box-shadow: 0 10px 40px rgba(0,0,0,0.9);
    }
    .chat-sidebar iframe { width: 100%; height: 100%; border: none; }
    .stream-card.is-active .remove-btn { display: none !important; }

    .empty { width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; color: #7a7a7d; font-size: 16px; grid-column: 1 / -1; grid-row: 1 / -1; }
    .toast {
      position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%) translateY(20px);
      background: #1f1f23; border: 1px solid #555; color: #fff; padding: 12px 24px;
      border-radius: 8px; font-size: 14px; font-weight: 500; opacity: 0; pointer-events: none;
      transition: all 0.3s ease; z-index: 10005; box-shadow: 0 0 20px rgba(0, 0, 0, 0.5);
    }
    .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

    @media (max-width: 1100px) {
      .stream-card.is-active { width: calc(100vw - 360px) !important; }
      .chat-sidebar { width: 300px !important; }
    }
    @media (max-width: 768px) {
      .stream-card.is-active { width: calc(100vw - 20px) !important; left: 10px !important; height: calc(45vh) !important; }
      .chat-sidebar { top: calc(var(--header-h) + 45vh + 15px) !important; width: calc(100vw - 20px) !important; left: 10px !important; height: calc(55vh - var(--header-h) - 25px) !important; }
    }

    @keyframes popIn { from { opacity: 0; transform: scale(0.95); } to { opacity: 1; transform: scale(1); } }
    @keyframes shake { 0%, 100% { transform: translateX(0); } 20% { transform: translateX(-6px); } 40% { transform: translateX(6px); } 60% { transform: translateX(-4px); } 80% { transform: translateX(4px); } }
  </style>
</head>
<body>

  <div class="header-wrapper" id="headerWrapper">
    <div class="header-main">
      <div class="logo" id="mainLogo">
        <div class="multi-stream">Multi<span>Stream</span></div>
        <div class="badge">[Twitch/Kick]</div>
        <div class="update-timer" id="updateTimer">Только что</div>
      </div>
      <div class="header-controls">
        <div class="view-selector">
          <button class="view-btn" id="viewBtn">Вид: <span id="currentViewText">2D</span> <svg viewBox="0 0 24 24"><path d="M7 10l5 5 5-5z"/></svg></button>
          <div class="view-dropdown" id="viewDropdown">
            <div class="view-option active" data-view="2d">2D Сетка</div>
            <div class="view-option" data-view="3d">3D Комната</div>
          </div>
        </div>
        <button class="header-toggle" id="headerToggle">Свернуть</button>
      </div>
    </div>

    <div class="header-body">
      <input id="streamInput" type="text" placeholder="Имя стримера или ссылка (Twitch / Kick)" autocomplete="off">
      <button id="addBtn">Добавить</button>
      <button id="muteAllBtn">Заглушить все</button>
      <button id="shareBtn">Поделиться</button>
    </div>
  </div>

  <div id="view-2d" style="display: block;">
    <div id="grid" class="grid">
      <div class="empty" id="emptyMsg">Введите имя стримера и нажмите Enter</div>
    </div>
  </div>

  <div id="view-3d">
    <div id="canvas-container"></div>
    <div id="css3d-container"></div>
    <div id="view-3d-controls">
      <button id="resetCamera3D" type="button">Общий вид</button>
      <span id="roomStatus">КОМНАТА ОЖИДАЕТ СТРИМ</span>
    </div>
  </div>

  <div id="toast" class="toast">Ссылка скопирована!</div>

  <script>
(function() {
  const grid = document.getElementById('grid');
  const emptyMsg = document.getElementById('emptyMsg');
  const input = document.getElementById('streamInput');
  const addBtn = document.getElementById('addBtn');
  const muteAllBtn = document.getElementById('muteAllBtn');
  const shareBtn = document.getElementById('shareBtn');
  const toast = document.getElementById('toast');
  const headerWrapper = document.getElementById('headerWrapper');
  const headerToggle = document.getElementById('headerToggle');
  const mainLogo = document.getElementById('mainLogo');
  const view3D = document.getElementById('view-3d');
  const view2D = document.getElementById('view-2d');
  const viewBtn = document.getElementById('viewBtn');
  const viewDropdown = document.getElementById('viewDropdown');
  const currentViewText = document.getElementById('currentViewText');
  const options = document.querySelectorAll('.view-option');
  const view3DControls = document.getElementById('view-3d-controls');
  const resetCamera3DBtn = document.getElementById('resetCamera3D');
  const roomStatus = document.getElementById('roomStatus');
  const players = [];
  let isMutedAll = true;
  let lastUpdateTime = new Date(document.lastModified).getTime();
  if (!Number.isFinite(lastUpdateTime) || lastUpdateTime <= 0 || Date.now() - lastUpdateTime < 5000) lastUpdateTime = Date.now() - 60000;
  const updateTimerEl = document.getElementById('updateTimer');
  setInterval(() => {
    const diff = Math.max(0, Math.floor((Date.now() - lastUpdateTime) / 1000));
    updateTimerEl.textContent = diff < 60 ? 'Только что' : `${Math.floor(diff / 60)} мин. назад`;
  }, 1000);

  function updateMuteButton() {
    muteAllBtn.textContent = isMutedAll ? 'Включить звук' : 'Заглушить все';
    muteAllBtn.classList.toggle('active', !isMutedAll);
  }

  updateMuteButton();

  viewBtn.addEventListener('click', (e) => {
    e.stopPropagation();
    viewDropdown.classList.toggle('open');
  });

  document.addEventListener('click', () => viewDropdown.classList.remove('open'));

  options.forEach(opt => {
    opt.addEventListener('click', (e) => {
      const view = e.currentTarget.dataset.view;
      options.forEach(o => o.classList.remove('active'));
      e.currentTarget.classList.add('active');
      if (view === '3d') switchTo3D();
      else switchTo2D();
      setTimeout(resize3D, 60);
    });
  });

  function updateHeaderHeight() {
    const h = headerWrapper.offsetHeight;
    document.documentElement.style.setProperty('--header-h', h + 'px');
    setTimeout(resize3D, 350);
  }

  window.addEventListener('resize', updateHeaderHeight);
  window.addEventListener('load', updateHeaderHeight);

  function toggleHeader() {
    const isCollapsed = headerWrapper.classList.toggle('collapsed');
    headerToggle.textContent = isCollapsed ? 'Развернуть' : 'Свернуть';
    updateHeaderHeight();
  }

  mainLogo.addEventListener('click', () => {
    if (grid.classList.contains('theater')) exitTheaterMode();
    if (view3D.style.display === 'block') resetCamera3D();
  });

  function extractChannel(inputVal) {
    let val = String(inputVal || '').trim();
    if (!val) return null;
    let platform = 'twitch';
    let channel = val;
    if (!/^[a-z]+:\/\//i.test(val) && /^(www\.)?(twitch\.tv|kick\.com)\//i.test(val)) val = 'https://' + val;
    if (/^(https?:)?\/\//i.test(val)) {
      try {
        const url = new URL(val.startsWith('//') ? 'https:' + val : val);
        const host = url.hostname.toLowerCase().replace(/^www\./, '');
        if (host === 'kick.com' || host.endsWith('.kick.com')) platform = 'kick';
        else if (host === 'twitch.tv' || host.endsWith('.twitch.tv')) platform = 'twitch';
        else return null;
        const parts = url.pathname.split('/').filter(Boolean);
        let first = parts[0] || '';
        if (first.toLowerCase() === 'popout' && parts[1]) first = parts[1];
        if (first.toLowerCase() === 'embed' && parts[1]) first = parts[1];
        channel = first;
      } catch (e) {
        return null;
      }
    } else {
      channel = val.replace(/^@/, '');
    }
    channel = channel.trim().replace(/^@/, '').toLowerCase();
    if (!/^[a-z0-9_]{1,50}$/.test(channel)) return null;
    if (['directory', 'videos', 'downloads', 'settings', 'popout', 'embed', 'p', 'jobs', 'subscriptions'].includes(channel)) return null;
    return { platform, channel };
  }

  function getParentDomains() {
    return [location.hostname || 'localhost'];
  }

  function buildTwitchPlayerUrl(channel, muted) {
    const params = new URLSearchParams();
    params.set('channel', channel);
    getParentDomains().forEach(parent => params.append('parent', parent));
    params.set('autoplay', 'true');
    params.set('muted', String(Boolean(muted)));
    return 'https://player.twitch.tv/?' + params.toString();
  }

  function buildKickPlayerUrl(channel, muted, autoplay = true) {
    const params = new URLSearchParams();
    params.set('autoplay', String(Boolean(autoplay)));
    params.set('muted', String(Boolean(muted)));
    params.set('parent', location.hostname || 'localhost');
    return `https://player.kick.com/${encodeURIComponent(channel)}?${params.toString()}`;
  }

  function buildChatUrl(entry) {
    if (entry.type === 'kick') return `https://kick.com/popout/${encodeURIComponent(entry.channel)}/chat`;
    const params = new URLSearchParams();
    getParentDomains().forEach(parent => params.append('parent', parent));
    params.set('darkpopout', '');
    return `https://www.twitch.tv/embed/${encodeURIComponent(entry.channel)}/chat?${params.toString()}`;
  }

  function suspend2DEntry(entry) {
    if (!entry) return;
    if (entry.type === 'twitch') {
      if (entry.player) {
        try { entry.player.pause(); } catch (e) {}
      }
    } else if (entry.type === 'kick' && entry.iframe && !entry.kickSuspended) {
      entry.iframe.src = 'about:blank';
      entry.kickSuspended = true;

  function suspend2DPlayers() {
    players.forEach(suspend2DEntry);

  function resume2DPlayers() {
    players.forEach(entry => {
      if (entry.type === 'twitch' && entry.player) {
        try {
          entry.player.setMuted(isMutedAll);
          entry.player.play();
        } catch (e) {}
      } else if (entry.type === 'kick' && entry.iframe && entry.kickSuspended) {
        entry.iframe.src = buildKickPlayerUrl(entry.channel, isMutedAll, true);
        entry.kickSuspended = false;
      }
    });
  }

  function createTwitchPlayer(container, channel) {
    const divId = 'tw-' + channel + '-' + Date.now() + '-' + Math.random().toString(36).slice(2, 7);
    const div = document.createElement('div');
    div.id = divId;
    container.appendChild(div);
    const embed = new Twitch.Embed(divId, {
      width: '100%',
      height: '100%',
      channel,
      parent: getParentDomains(),
      layout: 'video',
      muted: true,
      autoplay: true
    });
    const entry = { type: 'twitch', channel, embed, player: null, container, card: null, removed: false };
    embed.addEventListener(Twitch.Embed.VIDEO_READY, function() {
      if (entry.removed) return;
      entry.player = embed.getPlayer();
      if (!entry.player) return;
      const playerFrame = container.querySelector('iframe');
      if (playerFrame) {
        playerFrame.allow = 'autoplay; fullscreen; picture-in-picture';
        playerFrame.allowFullscreen = true;
      }
      try {
        if (entry.player) {
          if (view3D.style.display === 'block') {
            entry.player.pause();
          } else {
            startTwitchPlayback(entry.player, () => !entry.removed && players.includes(entry) && view3D.style.display !== 'block', true);
          }
        }
      } catch (e) {}
    });
    players.push(entry);
    return entry;
  }

  function createKickPlayer(container, channel) {
    const iframe = document.createElement('iframe');
    iframe.src = buildKickPlayerUrl(channel, true, true);
    iframe.allow = 'autoplay; fullscreen; picture-in-picture';
    iframe.allowFullscreen = true;
    iframe.referrerPolicy = 'strict-origin-when-cross-origin';
    container.appendChild(iframe);
    const entry = { type: 'kick', channel, iframe, container, card: null, kickSuspended: false };
    players.push(entry);
    return entry;
  }

  function enterTheaterMode(card, entry) {
    players.forEach(p => {
      if (p !== entry && p.type === 'twitch' && p.player) {

    if (activeCard) activeCard.classList.remove('is-active');

  function swapTheaterStream(newCard, newEntry) {
    const activeCard = document.querySelector('.stream-card.is-active');
    const chatSidebar = document.querySelector('.chat-sidebar');
    if (activeCard === newCard) return;
    if (activeCard) activeCard.classList.remove('is-active');
    newCard.classList.add('is-active');
    if (chatSidebar) {
      const iframe = chatSidebar.querySelector('iframe');
      if (iframe) iframe.src = buildChatUrl(newEntry);
    }
    players.forEach(p => {
      if (p.type === 'twitch' && p.player) {
        try {
          if (p === newEntry) p.player.play();
          else p.player.pause();
        } catch (e) {}
      }
    });

  function parseUrlForStreams() {
    const params = new URLSearchParams(location.search);
    const streamsParam = params.get('streams');
    if (!streamsParam) return [];
    return streamsParam.split(',').map(value => {
      const item = value.trim();
      if (!item) return null;
      const isKick = item.toLowerCase().startsWith('kick:');
      const channel = (isKick ? item.slice(5) : item).trim().toLowerCase();
      if (!/^[a-z0-9_]{1,50}$/.test(channel)) return null;
      return { platform: isKick ? 'kick' : 'twitch', channel };
    }).filter(Boolean);
  }

  function addBox(parent, width, height, depth, material, x, y, z, castShadow = false, receiveShadow = false) {
    const mesh = new THREE.Mesh(new THREE.BoxGeometry(width, height, depth), material);
    mesh.position.set(x, y, z);
    mesh.castShadow = castShadow;
    mesh.receiveShadow = receiveShadow;
    parent.add(mesh);

  function addRod(parent, start, end, radius, material) {
    const a = new THREE.Vector3(start[0], start[1], start[2]);
    const b = new THREE.Vector3(end[0], end[1], end[2]);
    const direction = new THREE.Vector3().subVectors(b, a);
    const mesh = new THREE.Mesh(new THREE.CylinderGeometry(radius, radius, direction.length(), 10), material);
    mesh.position.copy(a).add(b).multiplyScalar(0.5);
    mesh.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), direction.normalize());
    mesh.castShadow = false;
    mesh.receiveShadow = false;
    parent.add(mesh);
    return mesh;
  }

  function startTwitchPlayback(player, isValid, unmuteAfterStart) {
    if (!player) return;
    let playbackStarted = false;
    let playingListener = null;
    const unmute = () => {
      if (!unmuteAfterStart || isMutedAll || !isValid()) return;
      try { player.setMuted(false); } catch (e) {}
    };
    if (typeof Twitch !== 'undefined' && Twitch.Player && Twitch.Player.PLAYING && typeof player.addEventListener === 'function') {
      playingListener = () => {
        playbackStarted = true;
        unmute();
      };
      try { player.addEventListener(Twitch.Player.PLAYING, playingListener); } catch (e) {}
    }
    const attempt = () => {
      if (!isValid()) return;
      try {
        player.setMuted(true);
        const result = player.play();
        if (result && typeof result.catch === 'function') result.catch(() => {});
      } catch (e) {}
    };
    attempt();
    [450, 1000, 1900, 3300, 5500, 8500, 12500].forEach(delay => {
      setTimeout(() => {
        if (!isValid()) return;
        try {
          if (typeof player.isPaused !== 'function' || player.isPaused()) attempt();
          if (playbackStarted) unmute();
        } catch (e) {}
      }, delay);
    });
    if (unmuteAfterStart && !isMutedAll) {
      setTimeout(() => {
        if (!isValid()) return;
        try {
          if (typeof player.isPaused === 'function' && !player.isPaused()) unmute();
        } catch (e) {}
      }, 2500);
    }
  }

  function loadTVIframeWhenConnected(tvObj, entry, iframe) {
    const token = (tvObj.loadToken || 0) + 1;
    tvObj.loadToken = token;
    tvObj.playerLoaded = false;
    let attempts = 0;
    const load = () => {
      if (tvObj.loadToken !== token || tvObj.entry !== entry || tvObj.iframe !== iframe || view3D.style.display !== 'block') return;
      if (!tvObj.playerMount.isConnected || !iframe.isConnected || document.visibilityState !== 'visible') {
        attempts++;
        if (attempts < 600) requestAnimationFrame(load);
        return;
      }
      const url = entry.type === 'kick' ? buildKickPlayerUrl(entry.channel, isMutedAll, true) : buildTwitchPlayerUrl(entry.channel, isMutedAll);
      iframe.src = url;
      tvObj.playerMuted = isMutedAll;
      tvObj.playerLoaded = true;
    };
    requestAnimationFrame(load);
  }

  function createTVTwitchPlayer(tvObj, entry) {
    tvObj.playerKey = 'twitch:' + entry.channel;
    tvObj.playerMuted = isMutedAll;
    tvObj.playerLoaded = false;
    tvObj.iframe = null;
    tvObj.twitchEmbed = null;
    tvObj.twitchPlayer = null;
    setTVPlayerPointer(tvObj, focusedTV === tvObj);
    const token = tvObj.loadToken;
    const mount = document.createElement('div');
    mount.id = 'tv-twitch-' + Date.now() + '-' + Math.random().toString(36).slice(2, 9);
    mount.style.width = '562px';
    mount.style.height = '322px';
    tvObj.playerMount.appendChild(mount);
    let attempts = 0;
    const initialize = () => {
      if (tvObj.loadToken !== token || tvObj.entry !== entry || tvObj.playerKey !== 'twitch:' + entry.channel || view3D.style.display !== 'block' || !players.includes(entry)) return;
      if (!mount.isConnected || document.visibilityState !== 'visible') {
        attempts++;
        if (attempts < 600) requestAnimationFrame(initialize);
        return;
      }
      if (typeof Twitch === 'undefined' || !Twitch.Embed) {
        const iframe = document.createElement('iframe');
        iframe.allow = 'autoplay *; fullscreen *; picture-in-picture *; encrypted-media *';
        iframe.allowFullscreen = true;
        iframe.loading = 'eager';
        iframe.width = '562';
        iframe.height = '322';
        iframe.referrerPolicy = 'origin';
        iframe.title = `Twitch ${entry.channel}`;
        tvObj.playerMount.replaceChildren(iframe);
        tvObj.iframe = iframe;
        loadTVIframeWhenConnected(tvObj, entry, iframe);
        return;
      }
      const embed = new Twitch.Embed(mount.id, {
        width: 562,
        height: 322,
        channel: entry.channel,
        parent: getParentDomains(),
        layout: 'video',
        muted: true,
        autoplay: true
      });
      tvObj.twitchEmbed = embed;
      embed.addEventListener(Twitch.Embed.VIDEO_READY, function() {
        if (tvObj.entry !== entry || tvObj.twitchEmbed !== embed || view3D.style.display !== 'block' || !players.includes(entry)) return;
        try {
          tvObj.twitchPlayer = embed.getPlayer();
          tvObj.iframe = tvObj.playerMount.querySelector('iframe');
          tvObj.playerMuted = isMutedAll;
          if (tvObj.iframe) {
            tvObj.iframe.allow = 'autoplay *; fullscreen *; picture-in-picture *; encrypted-media *';
            tvObj.iframe.allowFullscreen = true;
            tvObj.iframe.width = '562';
            tvObj.iframe.height = '322';
            tvObj.iframe.referrerPolicy = 'origin';
          }
          setTVPlayerPointer(tvObj, focusedTV === tvObj);
          startTwitchPlayback(tvObj.twitchPlayer, () => tvObj.entry === entry && tvObj.twitchEmbed === embed && view3D.style.display === 'block' && players.includes(entry), !isMutedAll);
          tvObj.playerLoaded = true;
        } catch (e) {}
      });
    };
    requestAnimationFrame(initialize);
  }

  function createTVKickPlayer(tvObj, entry) {
    const iframe = document.createElement('iframe');
    iframe.allow = 'autoplay *; fullscreen *; picture-in-picture *; encrypted-media *';
    iframe.allowFullscreen = true;
    iframe.loading = 'eager';
    iframe.width = '562';
    iframe.height = '322';
    iframe.referrerPolicy = 'strict-origin-when-cross-origin';
    iframe.title = `Kick ${entry.channel}`;
    tvObj.playerMount.appendChild(iframe);
    tvObj.iframe = iframe;
    tvObj.playerKey = 'kick:' + entry.channel;
    tvObj.playerMuted = isMutedAll;
    setTVPlayerPointer(tvObj, focusedTV === tvObj);
    loadTVIframeWhenConnected(tvObj, entry, iframe);
  }

  function createTVPlayer(tvObj, entry) {
    destroyTVPlayer(tvObj);
    if (entry.type === 'twitch') createTVTwitchPlayer(tvObj, entry);
    else createTVKickPlayer(tvObj, entry);
  }

  function ensureTVPool(count) {
    const required = Math.max(1, count);
    while (tvPool.length < required) createTVObject();
  }

  function init3D() {
    scene = new THREE.Scene();
    scene.background = new THREE.Color(0x010102);
    scene.fog = new THREE.FogExp2(0x010102, 0.0035);
    camera = new THREE.PerspectiveCamera(50, Math.max(1, view3D.clientWidth) / Math.max(1, view3D.clientHeight), 0.1, 350);
    camera.position.set(0, 5, 17);
    renderer = new THREE.WebGLRenderer({ antialias: false, alpha: false, powerPreference: 'high-performance' });
    renderer.setSize(Math.max(1, view3D.clientWidth), Math.max(1, view3D.clientHeight));
    renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 1.25));
    renderer.shadowMap.enabled = false;
    renderer.outputEncoding = THREE.sRGBEncoding;
    document.getElementById('canvas-container').appendChild(renderer.domElement);
    cssRenderer = new THREE.CSS3DRenderer();
    cssRenderer.setSize(Math.max(1, view3D.clientWidth), Math.max(1, view3D.clientHeight));
    const cssElement = cssRenderer.domElement;
    cssElement.style.pointerEvents = 'none';
    document.getElementById('css3d-container').appendChild(cssElement);
    controls = new THREE.OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.dampingFactor = 0.08;
    controls.enablePan = false;
    controls.enableRotate = false;
    controls.enableZoom = false;
    controls.enableKeys = false;
    controls.minDistance = 5;
    controls.maxDistance = 45;
    controls.minPolarAngle = 1.12;
    controls.maxPolarAngle = 1.55;
    controls.target.set(0, 1.65, 0);
    controls.update();
    renderer.domElement.addEventListener('wheel', e => e.preventDefault(), { passive: false });
    view3D.addEventListener('wheel', e => e.preventDefault(), { passive: false, capture: true });
    renderer.domElement.addEventListener('pointermove', on3DCanvasMove);
    renderer.domElement.addEventListener('pointerleave', () => scheduleHoverClear());
    renderer.domElement.addEventListener('click', on3DCanvasClick);
    scene.add(new THREE.AmbientLight(0x77717e, 0.24));
    const keyLight = new THREE.DirectionalLight(0xbeb3c8, 0.58);
    keyLight.position.set(-8, 15, 18);
    keyLight.castShadow = false;
    scene.add(keyLight);
    const purpleLight = new THREE.PointLight(0x38204e, 0.72, 32);
    purpleLight.position.set(11, 6, -12);
    scene.add(purpleLight);
    const warmLight = new THREE.PointLight(0x4b382c, 0.42, 30);
    warmLight.position.set(-12, 5, 5);
    scene.add(warmLight);
    const roomGeo = new THREE.BoxGeometry(72, 80, 100);
    const roomMat = new THREE.MeshStandardMaterial({ color: 0x020203, roughness: 1, metalness: 0, side: THREE.BackSide });
    const room = new THREE.Mesh(roomGeo, roomMat);
    room.position.set(0, 40, -18);
    room.receiveShadow = false;
    scene.add(room);
    const floor = new THREE.Mesh(new THREE.PlaneGeometry(72, 100), new THREE.MeshStandardMaterial({ color: 0x030304, roughness: 0.99, metalness: 0.02 }));
    floor.rotation.x = -Math.PI / 2;
    floor.position.set(0, 0.01, -18);
    floor.receiveShadow = false;
    scene.add(floor);
    const backGlow = new THREE.Mesh(new THREE.PlaneGeometry(40, 16), new THREE.MeshBasicMaterial({ color: 0x08060b, transparent: true, opacity: 0.12 }));
    backGlow.position.set(0, 8, -67.85);
    scene.add(backGlow);
    tvGroup = new THREE.Group();
    scene.add(tvGroup);
    ensureTVPool(1);
  }

  function getLayout(count) {
    if (count <= 0) {
      return {
        items: [],
        target: new THREE.Vector3(0, 1.65, 0),
        rows: 1,
        cols: 1,
        width: 5.4,
        height: 4.2,
        depth: 4.2
      };
    }
    const cols = count <= 3 ? count : count === 4 ? 2 : count <= 6 ? 3 : 4;
    const rows = Math.ceil(count / cols);
    const scale = count === 1 ? 1.12 : count <= 3 ? 1.0 : count <= 6 ? 0.94 : Math.max(0.60, 0.86 - Math.max(0, count - 8) * 0.022);
    const gapX = 5.35;
    const gapY = 4.7;
    const items = [];
    for (let i = 0; i < count; i++) {
      const row = Math.floor(i / cols);
      const col = i % cols;
      const itemsInRow = Math.min(cols, count - row * cols);
      const x = (col - (itemsInRow - 1) / 2) * gapX;
      const y = (rows - 1 - row) * gapY;
      items.push({ x, y, z: 0, ry: 0, scale });
    }
    const maxX = Math.max(...items.map(item => Math.abs(item.x))) + 2.8 * scale;
    const width = maxX * 2;
    const height = (rows - 1) * gapY + 4.25 * scale;
    return {
      items,
      target: new THREE.Vector3(0, (rows - 1) * gapY / 2 + 1.68 * scale, 0),
      rows,
      cols,
      width,
      height,
      depth: 4.2 * scale
    };
  }

  function setCameraTween(target, position, duration = 850) {
    if (!camera || !controls) return;
    const safeTarget = target.clone();
    const safePosition = position.clone();
    safeTarget.x = THREE.MathUtils.clamp(safeTarget.x, -30, 30);
    safeTarget.y = THREE.MathUtils.clamp(safeTarget.y, 0.5, 42);
    safeTarget.z = THREE.MathUtils.clamp(safeTarget.z, -45, 8);
    safePosition.x = THREE.MathUtils.clamp(safePosition.x, -32, 32);
    safePosition.y = THREE.MathUtils.clamp(safePosition.y, 1.5, 48);
    safePosition.z = THREE.MathUtils.clamp(safePosition.z, -42, 30);
    cameraTween = {
      startPosition: camera.position.clone(),
      startTarget: controls.target.clone(),
      endPosition: safePosition,
      endTarget: safeTarget,
      startTime: performance.now(),
      duration
    };
    requestRender3D();
  }

  function updateCameraTween() {
    if (!cameraTween) return;
    const raw = Math.min(1, (performance.now() - cameraTween.startTime) / cameraTween.duration);
    const t = raw * raw * (3 - 2 * raw);
    camera.position.lerpVectors(cameraTween.startPosition, cameraTween.endPosition, t);
    controls.target.lerpVectors(cameraTween.startTarget, cameraTween.endTarget, t);
    if (raw >= 1) cameraTween = null;
  }

  function updateRoomStatus() {
    if (!players.length) {
      roomStatus.textContent = 'КОМНАТА ОЖИДАЕТ СТРИМ';
      return;
    }
    if (focusedTV && focusedTV.entry && players.includes(focusedTV.entry)) {
      roomStatus.textContent = `${focusedTV.entry.type.toUpperCase()} · ${focusedTV.entry.channel}${focusedTV.isChatOpen ? ' · ЧАТ' : ''}`;
      return;
    }
    roomStatus.textContent = `${players.length} ТРАНСЛЯЦИЙ`;
  }

  function frameOverview(smooth = true) {
    if (!camera || !controls) return;
    if (hoverFocusTimer) {
      clearTimeout(hoverFocusTimer);
      hoverFocusTimer = null;
    }
    closeAllChats3D();
    focusedTV = null;
    hoveredTV = null;
    if (resetCamera3DBtn) {
      resetCamera3DBtn.textContent = 'Общий вид';
      resetCamera3DBtn.classList.remove('is-active');
    }
    if (hoverClearTimer) {
      clearTimeout(hoverClearTimer);
      hoverClearTimer = null;
    }
    updateTVHighlights();
    tvPool.forEach(tv => {
      setTVPlayerPointer(tv, false);
      tv.controlsCssObj.visible = false;
      tv.focusBtn.classList.remove('is-active');
      tv.focusBtn.textContent = '↗ ПРИБЛИЗИТЬ';
      tv.chatBtn.style.display = 'none';
    });
    const target = layoutInfo.target.clone();
    const aspect = Math.max(0.75, view3D.clientWidth / Math.max(1, view3D.clientHeight));
    const halfFov = THREE.MathUtils.degToRad(camera.fov / 2);
    const distanceByWidth = (layoutInfo.width || 5) / (2 * Math.tan(halfFov) * aspect * 0.96);
    const distanceByHeight = (layoutInfo.height || 4.2) / (2 * Math.tan(halfFov) * 0.94);
    const distance = Math.max(6.8, distanceByWidth, distanceByHeight);
    const height = Math.max(1.8, Math.min(3.2, distance * 0.17));
    const position = target.clone().add(new THREE.Vector3(0, height, distance));
    if (smooth) setCameraTween(target, position, 780);
    else {
      camera.position.copy(position);
      controls.target.copy(target);
      cameraTween = null;
      controls.update();
      requestRender3D();
    }
    updateRoomStatus();
  }

  function setTVHighlight(tvObj, active) {
    if (!tvObj) return;
    tvObj.isHovered = active;
    if (tvObj.group && tvObj.baseScale) {
      const scale = tvObj.baseScale * (active ? 1.018 : 1);
      tvObj.group.scale.set(scale, scale, scale);
    }
    tvObj.highlightMaterials.forEach(material => {
      if (material.emissive) {
        material.emissive.setHex(active ? 0x24133b : 0x000000);
        material.emissiveIntensity = active ? 0.85 : 0.35;
      }
    });
    requestRender3D();
  }

  function updateTVHighlights() {
    tvPool.forEach(tv => setTVHighlight(tv, tv === hoveredTV || tv === focusedTV));
  }

  function setHoveredTV(tvObj) {
    if (hoverClearTimer) {
      clearTimeout(hoverClearTimer);
      hoverClearTimer = null;
    }
    hoverExitPending = false;
    if (hoveredTV === tvObj) {
      if (!tvObj) hoverSuppressedTV = null;
      return;
    }
    hoveredTV = tvObj;
    if (hoverFocusTimer) {
      clearTimeout(hoverFocusTimer);
      hoverFocusTimer = null;
    }
    if (!tvObj) {
      hoverSuppressedTV = null;
    } else if (tvObj !== hoverSuppressedTV && tvObj.entry && focusedTV !== tvObj) {
      hoverFocusTimer = setTimeout(() => {
        hoverFocusTimer = null;
        if (!hoverExitPending && hoveredTV === tvObj && tvObj.entry && focusedTV !== tvObj && view3D.style.display === 'block') focusTV(tvObj, false);
      }, 200);
    }
    if (renderer) renderer.domElement.style.cursor = tvObj && tvObj.entry ? 'pointer' : 'default';
    updateTVHighlights();
    updateTVControls();
    requestRender3D();
  }

  function scheduleHoverClear() {
    hoverExitPending = true;
    if (hoverClearTimer) clearTimeout(hoverClearTimer);
    hoverClearTimer = setTimeout(() => {
      hoverClearTimer = null;
      hoverExitPending = false;
      setHoveredTV(null);
    }, 300);
  }

  function updateTVControls() {
    if (resetCamera3DBtn) {
      resetCamera3DBtn.textContent = focusedTV ? '← Общий вид' : 'Общий вид';
      resetCamera3DBtn.classList.toggle('is-active', Boolean(focusedTV));
    }
    tvPool.forEach(tv => {
      const visible = Boolean(tv.entry && (tv === hoveredTV || tv === focusedTV));
      tv.controlsCssObj.visible = visible && !tv.isChatOpen;
      tv.chatBtn.style.display = tv === focusedTV ? 'flex' : 'none';
      tv.focusBtn.classList.toggle('is-active', tv === focusedTV);
      tv.focusBtn.textContent = tv === focusedTV ? '← ОБЩИЙ ВИД' : '↗ ПРИБЛИЗИТЬ';
      tv.focusBtn.title = tv === focusedTV ? 'Вернуться к общему виду' : 'Приблизить телевизор';
      if (tv.group && tv.group.position.x > 0) tv.controlsCssObj.position.x = -2.42;
      else tv.controlsCssObj.position.x = 2.42;
    });
    requestRender3D();
  }

  function moveCameraToTV(tvObj, includeChat, distance, duration) {
    if (!tvObj || !camera || !controls) return;
    tvObj.group.updateMatrixWorld(true);
    const target = new THREE.Vector3(0, 1.72, 0.25).applyMatrix4(tvObj.group.matrixWorld);
    if (includeChat) target.x += 1.0 * tvObj.group.scale.x;
    const position = target.clone().add(new THREE.Vector3(0, 0.55, distance));
    setCameraTween(target, position, duration);
  }

  function resetCamera3D() {
    if (!scene) return;
    const currentTV = focusedTV || hoveredTV;
    if (currentTV) hoverSuppressedTV = currentTV;
    if (hoverFocusTimer) {
      clearTimeout(hoverFocusTimer);
      hoverFocusTimer = null;
    }
    frameOverview(true);
    if (resetCamera3DBtn) {
      resetCamera3DBtn.textContent = 'Общий вид';
      resetCamera3DBtn.classList.remove('is-active');
    }
  }

  function toggleTVFocus(tvObj) {
    if (!tvObj || !tvObj.entry) return;
    if (focusedTV === tvObj) {
      hoverSuppressedTV = tvObj;
      if (hoverFocusTimer) {
        clearTimeout(hoverFocusTimer);
        hoverFocusTimer = null;
      }
      resetCamera3D();
      return;
    }
    hoverSuppressedTV = null;
    focusTV(tvObj, false);
  }

  function focusTV(tvObj, includeChat = false) {
    if (!tvObj || !tvObj.entry || !camera || !controls) return;
    closeAllChats3D(tvObj);
    if (hoverFocusTimer) {
      clearTimeout(hoverFocusTimer);
      hoverFocusTimer = null;
    }
    hoverSuppressedTV = null;
    focusedTV = tvObj;
    hoveredTV = tvObj;
    updateTVHighlights();
    updateTVControls();
    tvPool.forEach(tv => setTVPlayerPointer(tv, tv === tvObj));
    if (tvObj.twitchPlayer) startTwitchPlayback(tvObj.twitchPlayer, () => tvObj.entry && players.includes(tvObj.entry) && focusedTV === tvObj && view3D.style.display === 'block', !isMutedAll);
    moveCameraToTV(tvObj, Boolean(includeChat || tvObj.isChatOpen), tvObj.isChatOpen ? 6.4 : 5.4, 700);
    updateRoomStatus();
  }

  function on3DCanvasMove(event) {
    if (!renderer || !camera) return;
    const rect = renderer.domElement.getBoundingClientRect();
    if (!rect.width || !rect.height) return;
    pointer.x = ((event.clientX - rect.left) / rect.width) * 2 - 1;
    pointer.y = -((event.clientY - rect.top) / rect.height) * 2 + 1;
    raycaster.setFromCamera(pointer, camera);
    const targets = tvPool.filter(tv => tv.group.visible && tv.entry).flatMap(tv => tv.selectMeshes);
    const hits = raycaster.intersectObjects(targets, false);
    setHoveredTV(hits.length ? hits[0].object.userData.tvObj : null);
  }

  function on3DCanvasClick(event) {
    if (!renderer || !camera) return;
    const rect = renderer.domElement.getBoundingClientRect();
    pointer.x = ((event.clientX - rect.left) / rect.width) * 2 - 1;
    pointer.y = -((event.clientY - rect.top) / rect.height) * 2 + 1;
    raycaster.setFromCamera(pointer, camera);
    const targets = tvPool.filter(tv => tv.group.visible && tv.entry).flatMap(tv => tv.selectMeshes);
    const hits = raycaster.intersectObjects(targets, false);
    if (hits.length && hits[0].object.userData.tvObj) toggleTVFocus(hits[0].object.userData.tvObj);
  }

  function closeChat3D(tvObj, keepFocus = true) {
    if (!tvObj) return;
    const wasOpen = tvObj.isChatOpen;
    tvObj.isChatOpen = false;
    tvObj.chatBtn.classList.remove('is-active');
    tvObj.chatCssObj.visible = false;
    tvObj.chatWrapper.style.pointerEvents = 'none';
    tvObj.chatIframe.src = 'about:blank';
    tvObj.chatSource = '';
    updateTVControls();
    if (keepFocus && wasOpen && focusedTV === tvObj && tvObj.entry) {
      tvObj.controlsCssObj.visible = true;
      moveCameraToTV(tvObj, false, 5.4, 480);
      updateRoomStatus();
    }
  }

  function closeAllChats3D(except) {
    tvPool.forEach(tvObj => {
      if (tvObj !== except && tvObj.isChatOpen) closeChat3D(tvObj, false);
    });
  }

  function toggleChat3D(tvObj) {
    if (!tvObj || !tvObj.entry || focusedTV !== tvObj) return;
    if (tvObj.isChatOpen) {
      closeChat3D(tvObj, true);
      return;
    }
    closeAllChats3D(tvObj);
    tvObj.isChatOpen = true;
    tvObj.chatBtn.classList.add('is-active');
    tvObj.chatCssObj.visible = true;
    tvObj.controlsCssObj.visible = false;
    tvObj.chatWrapper.style.pointerEvents = 'auto';
    const source = buildChatUrl(tvObj.entry);
    if (tvObj.chatSource !== source) {
      tvObj.chatSource = source;
      tvObj.chatIframe.src = source;
    }
    focusTV(tvObj, true);
    tvObj.controlsCssObj.visible = false;
  }

  function update3DRoom(reframe = false) {
    if (!scene || !tvGroup) return;
    const count = players.length;
    updateRoomStatus();
    ensureTVPool(count);
    if (count === 0) {
      tvPool.forEach(tvObj => {
        closeChat3D(tvObj, false);
        destroyTVPlayer(tvObj);
        tvObj.entry = null;
        tvObj.group.visible = false;
        tvObj.cssObj.visible = false;
        tvObj.chatCssObj.visible = false;
        tvObj.controlsCssObj.visible = false;
      });
      const emptyTV = tvPool[0];
      emptyTV.group.visible = true;
      emptyTV.cssObj.visible = true;
      emptyTV.placeholder.style.display = 'flex';
      emptyTV.group.position.set(0, 0, 0);
      emptyTV.group.rotation.set(0, 0, 0);
      emptyTV.group.scale.set(1.08, 1.08, 1.08);
      emptyTV.baseScale = 1.08;
      emptyTV.chatCssObj.visible = false;
      focusedTV = null;
      hoveredTV = null;
      layoutInfo = { target: new THREE.Vector3(0, 1.65, 0), rows: 1, cols: 1, width: 5.4, height: 4.2, depth: 4.2 };
      frameOverview(false);
      requestRender3D();
      return;
    }
    const used = new Set();
    const assignments = players.map(entry => {
      let tvObj = tvPool.find(tv => tv.entry === entry && !used.has(tv));
      if (!tvObj) tvObj = tvPool.find(tv => !used.has(tv) && (!tv.entry || !players.includes(tv.entry)));
      if (!tvObj) tvObj = createTVObject();
      used.add(tvObj);
      return { tvObj, entry };
    });
    tvPool.forEach(tvObj => {
      if (used.has(tvObj)) return;
      if (tvObj.entry && !players.includes(tvObj.entry)) {
        closeChat3D(tvObj, false);
        destroyTVPlayer(tvObj);
        tvObj.chatIframe.src = 'about:blank';
        tvObj.chatSource = '';
        tvObj.entry = null;
      }
      tvObj.group.visible = false;
      tvObj.cssObj.visible = false;
      tvObj.chatCssObj.visible = false;
      tvObj.controlsCssObj.visible = false;
    });
    const layout = getLayout(count);
    layoutInfo = layout;
    assignments.forEach(({ tvObj, entry }, index) => {
      if (tvObj.entry !== entry) {
        closeChat3D(tvObj, false);
        tvObj.chatIframe.src = 'about:blank';
        tvObj.chatSource = '';
        destroyTVPlayer(tvObj);
        tvObj.entry = entry;
      }
      tvObj.group.visible = true;
      tvObj.cssObj.visible = true;
      tvObj.placeholder.style.display = 'none';
      const playerKey = entry.type + ':' + entry.channel;
      if (tvObj.playerKey !== playerKey) {
        createTVPlayer(tvObj, entry);
      } else if (tvObj.iframe && !tvObj.playerLoaded) {
        loadTVIframeWhenConnected(tvObj, entry, tvObj.iframe);
      }
      if (tvObj.playerLoaded && tvObj.playerMuted !== isMutedAll) {
        if (entry.type === 'twitch' && tvObj.twitchPlayer) {
          try { tvObj.twitchPlayer.setMuted(isMutedAll); } catch (e) {}
          tvObj.playerMuted = isMutedAll;
        } else if (tvObj.iframe) {
          const url = entry.type === 'kick' ? buildKickPlayerUrl(entry.channel, isMutedAll, true) : buildTwitchPlayerUrl(entry.channel, isMutedAll);
          tvObj.iframe.src = url;
          tvObj.playerMuted = isMutedAll;
        }
      }
      const pos = layout.items[index];
      tvObj.group.position.set(pos.x, pos.y, pos.z);
      tvObj.group.rotation.set(0, pos.ry, 0);
      tvObj.group.scale.set(pos.scale, pos.scale, pos.scale);
      tvObj.baseScale = pos.scale;
      tvObj.chatTitle.textContent = `${entry.channel.toUpperCase()} · ЧАТ`;
      tvObj.chatBtn.classList.toggle('is-active', tvObj.isChatOpen);
      tvObj.chatBtn.title = `Открыть чат ${entry.channel}`;
      tvObj.closeBtn.title = `Закрыть ${entry.channel}`;
    });
    if (focusedTV && (!focusedTV.entry || !players.includes(focusedTV.entry))) focusedTV = null;
    if (focusedTV) {
      focusTV(focusedTV, focusedTV.isChatOpen);
    } else if (reframe || !focusedTV) {
      frameOverview(true);
    }
    updateTVControls();
    updateRoomStatus();
    requestRender3D();
  }

  function switchTo3D() {
    if (grid.classList.contains('theater')) exitTheaterMode();
    suspend2DPlayers();
    view3D.style.display = 'block';
    view2D.style.display = 'none';
    view3DControls.style.display = 'flex';
    currentViewText.textContent = '3D';
    updateRoomStatus();
    start3DLoop();
    update3DRoom(true);
    setTimeout(resize3D, 30);
  }

  function switchTo2D() {
    view3D.style.display = 'none';
    view2D.style.display = 'block';
    view3DControls.style.display = 'none';
    currentViewText.textContent = '2D';
    suspend3DPlayers();
    resume2DPlayers();
  }

  function suspend3DPlayers() {
    closeAllChats3D();
    tvPool.forEach(tvObj => {
      closeChat3D(tvObj, false);
      destroyTVPlayer(tvObj);
      tvObj.chatIframe.src = 'about:blank';
      tvObj.chatSource = '';
      tvObj.group.visible = false;
      tvObj.controlsCssObj.visible = false;
      tvObj.entry = null;
    });
    focusedTV = null;
    hoveredTV = null;
    cameraTween = null;
  }

  function start3DLoop() {
    requestRender3D();
  }

  function requestRender3D() {
    if (view3D.style.display !== 'block' || animationFrame !== null || !renderer || !scene || !camera) return;
    animationFrame = requestAnimationFrame(animate3D);
  }

  function animate3D() {
    animationFrame = null;
    if (view3D.style.display !== 'block' || !renderer || !scene || !camera) return;
    if (cameraTween) {
      updateCameraTween();
      controls.update();
    }
    renderer.render(scene, camera);
    cssRenderer.render(scene, camera);
    if (cameraTween) animationFrame = requestAnimationFrame(animate3D);
  }

  function resize3D() {
    if (!renderer || !camera || !cssRenderer) return;
    const width = view3D.clientWidth;
    const height = view3D.clientHeight;
    if (!width || !height) return;
    camera.aspect = width / height;
    camera.updateProjectionMatrix();
    renderer.setSize(width, height);
    cssRenderer.setSize(width, height);
    requestRender3D();
  }

  addBtn.addEventListener('click', addStream);
  input.addEventListener('keydown', e => {
    if (e.key === 'Enter') addStream();
  });
  muteAllBtn.addEventListener('click', toggleMuteAll);
  shareBtn.addEventListener('click', share);
  headerToggle.addEventListener('click', toggleHeader);
  resetCamera3DBtn.addEventListener('click', resetCamera3D);
  window.addEventListener('resize', resize3D);

  window.addEventListener('popstate', () => {
    exitTheaterMode();
    players.slice().forEach(entry => {
      entry.removed = true;
      if (entry.type === 'twitch' && entry.embed && typeof entry.embed.destroy === 'function') {
        try { entry.embed.destroy(); } catch (e) {}
      }
      if (entry.type === 'kick' && entry.iframe) entry.iframe.src = 'about:blank';
    });
    players.length = 0;
    grid.innerHTML = '';
    grid.appendChild(emptyMsg);
    emptyMsg.style.display = 'flex';
    updateLayout();
    const newStreams = parseUrlForStreams();
    newStreams.forEach(stream => addStreamByParsed(stream, true));
    updateLayout();
    if (view3D.style.display === 'block') update3DRoom(true);
    updateUrlFromPlayers();
  });

  document.addEventListener('click', () => {
    if (view3D.style.display !== 'block') {
      players.forEach(entry => {
        if (entry.type === 'twitch' && entry.player && !isMutedAll) {
          try { entry.player.play(); } catch (e) {}
        }
      });
    }
  }, { once: true });

  updateHeaderHeight();
  init3D();
  const streams = parseUrlForStreams();
  if (streams.length) {
    streams.forEach(stream => addStreamByParsed(stream, true));
    updateLayout();
    updateUrlFromPlayers();
  } else {
    update3DRoom(false);
  }
})();
  </script>
</body>
</html>
